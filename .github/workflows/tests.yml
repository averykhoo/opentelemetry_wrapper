# DEC-56: on push and pull requests, Python 3.12-3.14, with and without the optional extras; the steps are in ci/test.sh
#   extras `all`:  requirements.txt (every extra) and the whole test suite
#   extras `none`: the package installed alone (no extras): it imports and runs `@otel` (AC-20, ci/smoke_core.py)
# v0's dependencies stay core until 1.0.0 (DEC-80), so the `none` job installs them too; it is the guard that a
# no-extras install imports and runs v1 without loading v0
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest  # Linux, so the fork canary (tests/upstream/test_fork_resource.py) runs
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
        extras: ['all', 'none']
    name: tests (python ${{ matrix.python }}, extras ${{ matrix.extras }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: all extras, whole suite
        if: matrix.extras == 'all'
        run: bash ci/test.sh all
      - name: no extras, import and run
        if: matrix.extras == 'none'
        run: bash ci/test.sh core
