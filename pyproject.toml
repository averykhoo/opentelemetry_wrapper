[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "opentelemetry_wrapper"
authors = [{ name = "Avery Khoo", email = "averykhoo@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: Apache Software License"]
dynamic = ["version", "description"]
requires-python = ">3.8.0"

# NOTE: also update requirements.txt
dependencies = [
    "asgiref",
    "fastapi",
    "itsdangerous",
    "opentelemetry-api",
    "opentelemetry-exporter-otlp",
    "opentelemetry-exporter-prometheus",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-logging",
    "opentelemetry-instrumentation-requests",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-instrumentation-system-metrics",
    "opentelemetry-sdk",
    "pydantic",
    "requests",
    # TODO: temporary pin, since opentelemetry-instrumentation-sqlalchemy (<=0.66b0) silently skips sqlalchemy>=2.1
    #  check https://github.com/open-telemetry/opentelemetry-python-contrib/issues/5118 (and PR #5120)
    #  once a release supports 2.1, remove `<2.1` here AND in requirements.txt, and set that release as the minimum
    #  for opentelemetry-instrumentation-sqlalchemy; then check that `sqlalchemy_example.py` prints a `SELECT` span
    "sqlalchemy[asyncio]<2.1",
    "starlette",
    "typing-extensions",
    "uvicorn",
]

[project.urls]
Home = "https://github.com/averykhoo/opentelemetry_wrapper"
