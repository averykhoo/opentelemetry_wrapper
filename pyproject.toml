[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "opentelemetry_wrapper"
authors = [{ name = "Avery Khoo", email = "averykhoo@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dynamic = ["version", "description"]
# DEC-44: v1 needs 3.12; this floor ships with 1.0.0, the first release with v1 (older Pythons get the last 0.x)
requires-python = ">=3.12"

# DEC-57: strict OTel pins. The SDK family (1.x) is capped at the next minor and the contrib packages (0.XbY, released
# in lockstep with it) at the matching window; a cap moves only when the canaries and CI say so. Keep the two windows,
# and requirements.txt, in step. (A "<0.67" bound excludes the 0.67 pre-releases, so 0.67b0 is out.)
# DEC-36: OTLP over HTTP only, so opentelemetry-exporter-otlp (the meta package that pulls in grpcio) is not a dependency.
# DEC-96: from 1.0.0 the plain install is lean (v0 and its FastAPI, SQLAlchemy, requests, pydantic and gRPC dependencies
# are gone); every integration comes through its extra (AC-20).
# NOTE: also update requirements.txt
dependencies = [
    "opentelemetry-api>=1.45,<1.46",
    "opentelemetry-sdk>=1.45,<1.46",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<1.46",
    "opentelemetry-semantic-conventions>=0.66b0,<0.67",
    "opentelemetry-instrumentation-logging>=0.66b0,<0.67",
    "opentelemetry-exporter-prometheus>=0.66b0,<0.67",
]

[project.optional-dependencies]
# DEC-11 / DEC-35: each integration is optional at call time; the extra pulls its contrib instrumentor and the library
fastapi = [
    "opentelemetry-instrumentation-fastapi>=0.66b0,<0.67",
    "fastapi",
]
sqlalchemy = [
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0,<0.67",
    # TODO: temporary pin, since opentelemetry-instrumentation-sqlalchemy (<=0.66b1) silently skips sqlalchemy>=2.1
    #  check https://github.com/open-telemetry/opentelemetry-python-contrib/issues/5118 (and PR #5120)
    #  once a release supports 2.1, remove `<2.1` here AND in requirements.txt, and set that release as the minimum
    #  for opentelemetry-instrumentation-sqlalchemy; then check that `sqlalchemy_example.py` prints a `SELECT` span
    #  (OTW-15)
    "sqlalchemy<2.1",
]
requests = [
    "opentelemetry-instrumentation-requests>=0.66b0,<0.67",
    "requests",
]
system-metrics = [
    "opentelemetry-instrumentation-system-metrics>=0.66b0,<0.67",  # brings psutil
]
# DEC-16: the optional fast scrubbing engine (stdlib `re` is the default and the fallback)
hyperscan = [
    "hyperscan",
]
# interegular: the rule-overlap lint in the scrubbing tests; mypy: the typing tests; aiosqlite: the AsyncEngine tests
dev = [
    "pytest",
    "interegular",
    "mypy",  # OTW-14: the reveal_type tests (tests/typing)
    "aiosqlite",  # DEC-91: a real async sqlite driver for the AsyncEngine tests
]

[project.entry-points.pytest11]
# DEC-27: passive until a test asks for a fixture; `pytest -p no:opentelemetry_wrapper` turns it off
opentelemetry_wrapper = "opentelemetry_wrapper.v1.pytest_plugin"

[project.entry-points.opentelemetry_resource_detector]
# OTW-9: so plain OpenTelemetry can use them too (`OTEL_EXPERIMENTAL_RESOURCE_DETECTORS=otel_wrapper_k8s,...`)
otel_wrapper_k8s = "opentelemetry_wrapper.v1._resources:KubernetesResourceDetector"
otel_wrapper_process = "opentelemetry_wrapper.v1._resources:WrapperProcessResourceDetector"

[project.urls]
Home = "https://github.com/averykhoo/opentelemetry_wrapper"

[tool.mypy]
# OTW-14 / AC-21: `mypy` alone checks the package and the typing samples
files = ["opentelemetry_wrapper", "tests/typing"]
